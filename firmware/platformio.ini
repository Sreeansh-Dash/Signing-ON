; PlatformIO configuration for Assistive Sign-Language Training Glove
; Board: ESP32-S3 DevKitC-1 (Xtensa LX7 Dual-Core, 240 MHz, 8 MB PSRAM)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; CPU and memory configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi   ; Quad SPI flash + Octal PSRAM

; Custom partition table (includes LittleFS data partition)
board_build.partitions = partitions.csv

; PSRAM support (required for TFLite tensor arena)
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Library dependencies
lib_deps =
    ; TFLite Micro for ESP32 (V1.1 — uncomment when model is ready)
    ; tensorflow/tflite-micro @ ^0.1.0
